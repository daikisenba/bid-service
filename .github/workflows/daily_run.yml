name: Daily Bid Recommendation Batch

# 顧客ごとの入札案件レコメンドを生成し、顧客専用シートへの追記とメール送信までを行う。
# 顧客への自動送信の可否は config/settings.yaml の email.auto_send_to_customer で
# 顧客一律に切り替える(true: 顧客へ直接送信・管理者にはBcc / false: 管理者宛のみ)。
# 新着0件の日も「新着なし」メールを送る(main.py参照)。

on:
  schedule:
    # GitHub cron is UTC. 06:00 JST = 21:00 UTC の前日。
    # JST Mon-Fri -> UTC Sun-Thu (day-of-week 0-4)。
    #
    # 目標配信時刻は07:30 JSTだが、無料枠のスケジュール実行は「ベストエフォート、
    # 遅延あり」がGitHub公式の仕様であり、実測でも遅延幅がリポジトリの直近の
    # コミット頻度と相関して変動する(2026-09-16時点の実測: 活発な時期で
    # +12〜+32分、コミットが途絶えた時期は+95〜+575分)。100%の時刻保証は
    # この仕組みではできないため、90分のバッファを見て前倒しで発火させている。
    # それでも07:30に間に合わない日があれば、外部トリガー(例: Google Apps
    # Scriptの時刻起動トリガーからworkflow_dispatchを叩く)への切替を検討する。
    - cron: "0 21 * * 0-4"
  workflow_dispatch:
    inputs:
      mail_check:
        description: "Gmail送信の認証・委任のみを検証する(新着マッチ0件でも判定できる)"
        type: boolean
        default: false

concurrency:
  group: daily-bid-recommendation
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          # 依存ファイルが標準名(requirements.txt)ではないため明示する。
          # 未指定だとsetup-pythonのキャッシュ解決が失敗しジョブごと落ちる
          cache-dependency-path: requirements-bid-service.txt

      - name: Install dependencies
        run: pip install -r requirements-bid-service.txt

      - name: Run daily batch
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.mail_check != true }}
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python main.py --config config/settings.yaml

      - name: メール送信チェックのみ実行
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mail_check == true }}
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python main.py --config config/settings.yaml --mail-check
